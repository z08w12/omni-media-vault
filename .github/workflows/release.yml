name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.5)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Build release packages
        run: scripts/build-release.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Target Release Tag: $TAG"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG" || true
          fi

          NOTES="$(git tag -l "$TAG" --format='%(contents)' 2>/dev/null || true)"
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" release/*.tar.gz install.sh --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" release/*.tar.gz install.sh --title "$TAG" --generate-notes
          fi
